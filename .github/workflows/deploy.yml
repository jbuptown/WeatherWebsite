name: Build and deploy

on:
  push:
    branches:
      - main

permissions:
  contents: read
  packages: write

jobs:

  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Login to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: |
            ghcr.io/jbuptown/weatherwebsite:latest
            ghcr.io/jbuptown/weatherwebsite:${{ github.sha }}

  deploy:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Run deploy on server
        uses: appleboy/ssh-action@v1.0.0
        with:
          host: 139.100.235.137
          username: icss_predict
          key: ${{ secrets.ICCS }}
          script: |
            echo "SSH connected. Server-side deploy.sh is forced by sshd."