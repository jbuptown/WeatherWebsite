<!DOCTYPE html>
{% load static %}
<html lang="ru">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Расчёт траектории полёта</title>

  <!-- Yandex Maps JS API 2.1 (доступен в РФ без VPN) -->
  <script src="https://api-maps.yandex.ru/2.1/?apikey=14893153-03b0-4a66-a999-40bb38804538&lang=ru_RU"></script>

  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      height: 100vh;
      overflow: hidden;
    }

    /* ── Карта занимает всю область просмотра ── */
    #map {
      position: fixed;
      inset: 0;
      z-index: 1;
    }

    /* ── Общий стиль карточек ── */
    .card {
      background: #fff;
      border-radius: 16px;
      box-shadow: 0 4px 24px rgba(0,0,0,.14);
      position: fixed;
      z-index: 100;
    }

    /* ── Приветственное окно ── */
    #bubble {
      top: 20px;
      left: 50%;
      transform: translateX(-50%);
      padding: 16px 18px;
      max-width: 340px;
      display: flex;
      align-items: flex-start;
      gap: 12px;
      border-radius: 18px;
    }
    #bubble p {
      font-size: 14px;
      font-weight: 600;
      color: #222;
      line-height: 1.5;
    }
    #bubble-close {
      flex-shrink: 0;
      width: 26px; height: 26px;
      border-radius: 50%;
      border: none;
      background: #f0f0f0;
      cursor: pointer;
      font-size: 13px;
      color: #666;
      display: flex; align-items: center; justify-content: center;
      transition: background .2s;
    }
    #bubble-close:hover { background: #e0e0e0; }

    /* ── Левое меню ── */
    #menu {
      top: 24px;
      left: 24px;
      bottom: 24px;
      width: 310px;
      padding: 20px 18px;
      display: flex;
      flex-direction: column;
      gap: 0;
      overflow-y: auto;
      scrollbar-width: thin;
      scrollbar-color: #e0e0e0 transparent;
    }
    #menu::-webkit-scrollbar { width: 4px; }
    #menu::-webkit-scrollbar-thumb { background: #e0e0e0; border-radius: 4px; }

    .menu-brand {
      display: flex;
      align-items: center;
      justify-content: center;
      min-height: 78px;
      margin: 0 0 16px;
      padding: 12px 14px;
      border: 1px solid #333;
      border-radius: 6px;
      background: #050505;
      flex-shrink: 0;
    }
    .menu-brand img {
      display: block;
      width: 100%;
      max-height: 64px;
      object-fit: contain;
    }

    #menu-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 16px;
      flex-shrink: 0;
    }
    #menu-header h2 {
      font-size: 15px;
      font-weight: 700;
      color: #222;
    }
    #menu-close {
      width: 30px; height: 30px;
      border-radius: 50%;
      border: none;
      background: #f2f2f2;
      cursor: pointer;
      font-size: 14px;
      color: #555;
      display: flex; align-items: center; justify-content: center;
      transition: background .2s;
    }
    #menu-close:hover { background: #e4e4e4; }

    /* ── Строка поля ── */
    .field-row {
      display: flex;
      flex-direction: column;
      gap: 4px;
      margin-bottom: 9px;
    }
    .field-row label {
      font-size: 11px;
      color: #7c4dff;
      font-weight: 600;
      letter-spacing: .3px;
    }
    .field-row label::before { content: '◆ '; }

    .field-row input,
    .field-row select {
      border: 1px solid #e2e2e2;
      border-radius: 20px;
      padding: 8px 14px;
      font-size: 13px;
      color: #333;
      background: #fafafa;
      outline: none;
      width: 100%;
      transition: border-color .2s, background .2s;
      -webkit-appearance: none;
      appearance: none;
    }
    .field-row input:focus,
    .field-row select:focus {
      border-color: #7c4dff;
      background: #fff;
    }

    .select-wrap { position: relative; }
    .select-wrap::after {
      content: '▾';
      position: absolute;
      right: 13px; top: 50%;
      transform: translateY(-50%);
      color: #999; font-size: 12px;
      pointer-events: none;
    }

    .row-2 { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
    .row-2 .field-row.full-width { grid-column: 1 / -1; }

    .duration-control {
      display: grid;
      grid-template-columns: minmax(0, 1fr) 96px;
      gap: 8px;
      align-items: center;
    }
    .duration-conversion {
      min-height: 18px;
      margin-top: 4px;
      font-size: 11px;
      line-height: 1.3;
      color: #777;
    }

    .menu-sep { height: 1px; background: #f0f0f0; margin: 8px 0 10px; flex-shrink: 0; }

    /* ── Раздел результата ── */
    #result-section { display: none; flex-shrink: 0; }
    #result-section .result-coords {
      display: flex;
      gap: 6px;
      margin-top: 4px;
    }
    #result-section .result-coords span {
      flex: 1;
      background: #f5f0ff;
      border: 1px solid #d8c8ff;
      border-radius: 20px;
      padding: 6px 12px;
      font-size: 13px;
      color: #5c35cc;
      text-align: center;
      font-weight: 500;
    }

    /* ── Кнопки ── */
    #btn-calc {
      margin-top: 14px;
      width: 100%;
      padding: 11px;
      border-radius: 20px;
      border: none;
      background: #7c4dff;
      color: #fff;
      font-size: 14px;
      font-weight: 600;
      cursor: pointer;
      letter-spacing: .3px;
      transition: background .2s, transform .1s;
      box-shadow: 0 4px 14px rgba(124,77,255,.3);
      flex-shrink: 0;
    }
    #btn-calc:hover:not(:disabled) { background: #6a3de8; }
    #btn-calc:active:not(:disabled) { transform: scale(.98); }
    #btn-calc:disabled { background: #c0b0f0; box-shadow: none; cursor: not-allowed; }

    #btn-clear,
    #btn-export,
    #btn-export-kml {
      margin-top: 8px;
      width: 100%;
      padding: 9px;
      border-radius: 20px;
      border: 1px solid #e2e2e2;
      background: #fff;
      color: #777;
      font-size: 13px;
      cursor: pointer;
      transition: background .2s;
      flex-shrink: 0;
    }
    #btn-export,
    #btn-export-kml { display: none; }
    #btn-export {
      background: #1f9d55;
      border-color: #1f9d55;
      color: #fff;
      font-weight: 700;
    }
    #btn-export-kml {
      background: #2f6fd0;
      border-color: #2f6fd0;
      color: #fff;
      font-weight: 700;
    }
    #btn-clear:hover,
    #btn-export:hover { background: #f8f8f8; }
    #btn-export:hover {
      background: #188047;
      border-color: #188047;
      color: #fff;
    }
    #btn-export-kml:hover {
      background: #255ab0;
      border-color: #255ab0;
      color: #fff;
    }

    /* ── Кнопка открытия меню ── */
    #btn-menu-open {
      display: none;
      position: fixed;
      top: 24px; left: 24px;
      z-index: 110;
      width: 42px; height: 42px;
      border-radius: 12px;
      border: none;
      background: #fff;
      box-shadow: 0 4px 16px rgba(0,0,0,.15);
      font-size: 20px;
      cursor: pointer;
      align-items: center;
      justify-content: center;
      transition: background .2s;
    }
    #btn-menu-open:hover { background: #f5f5f5; }
    #btn-menu-open.visible { display: flex; }

    /* ── Строка состояния ── */
    #status-bar {
      position: fixed;
      bottom: 28px;
      left: 50%;
      transform: translateX(-50%);
      z-index: 200;
      background: #fff;
      border-radius: 20px;
      padding: 10px 22px;
      font-size: 13px;
      color: #333;
      box-shadow: 0 4px 20px rgba(0,0,0,.14);
      opacity: 0;
      transition: opacity .3s;
      white-space: nowrap;
      pointer-events: none;
      max-width: 90vw;
      text-align: center;
    }
    #status-bar.show  { opacity: 1; }
    #status-bar.error { color: #c62828; }

    /* ── Экран загрузки ── */
    #loading {
      display: none;
      position: fixed;
      inset: 0;
      z-index: 300;
      background: rgba(255,255,255,.6);
      align-items: center;
      justify-content: center;
      flex-direction: column;
      gap: 14px;
      backdrop-filter: blur(2px);
    }
    #loading.show { display: flex; }
    .spinner {
      width: 44px; height: 44px;
      border: 4px solid #ede8ff;
      border-top-color: #7c4dff;
      border-radius: 50%;
      animation: spin .8s linear infinite;
    }
    @keyframes spin { to { transform: rotate(360deg); } }
    #loading p { font-size: 14px; color: #555; font-weight: 500; }

    /* ── Легенда ── */
    #legend {
      position: fixed;
      bottom: 24px; right: 24px;
      z-index: 100;
      background: #fff;
      border-radius: 12px;
      padding: 10px 14px;
      box-shadow: 0 4px 16px rgba(0,0,0,.12);
      display: none;
      flex-direction: column;
      gap: 6px;
    }
    #legend.show { display: flex; }
    .leg-item { display: flex; align-items: center; gap: 8px; font-size: 12px; color: #444; }
    .leg-dot  { width: 10px; height: 10px; border-radius: 50%; flex-shrink: 0; }

    /* ── Всплывающее окно (балун) над точкой ── */
    .ymap-balloon {
      position: absolute;
      background: var(--ink);
      border: 1px solid #444;
      border-radius: 6px;
      box-shadow: 0 8px 28px rgba(0,0,0,.45);
      padding: 12px 36px 12px 14px;
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      font-size: 13px;
      color: #fff;
      min-width: 170px;
      white-space: nowrap;
    }
    .ymap-balloon__close {
      position: absolute;
      top: 8px; right: 9px;
      width: 20px; height: 20px;
      border: none;
      border-radius: 50%;
      background: var(--ink-muted);
      color: var(--white-soft);
      font-size: 13px;
      line-height: 1;
      cursor: pointer;
      display: flex; align-items: center; justify-content: center;
      transition: background .2s, color .2s;
    }
    .ymap-balloon__close:hover { background: #3a3a3a; color: #fff; }
    .ymap-balloon__tail {
      position: absolute;
      left: 50%; bottom: -7px;
      width: 12px; height: 12px;
      margin-left: -6px;
      background: var(--ink);
      border-right: 1px solid #444;
      border-bottom: 1px solid #444;
      transform: rotate(45deg);
    }
    .popup-title {
      font-weight: 700;
      font-size: 14px;
      color: #fff;
      margin-bottom: 6px;
    }
    .popup-row  { color: #bbb; margin-bottom: 2px; }
    .popup-row b, .popup-row span { font-weight: 600; color: #fff; }

    /* ── Точечные маркеры старта, финиша и разрыва ── */
    .balloon-marker, .flag-marker, .burst-marker { cursor: pointer; }

    .start-dot, .finish-dot, .burst-dot {
      width: 18px; height: 18px;
      border-radius: 50%;
      border: 3px solid #fff;
      box-shadow: 0 2px 8px rgba(0,0,0,.35);
      transition: transform .15s;
      cursor: pointer;
    }
    .start-dot  { background: #7c4dff; }
    .finish-dot { background: #c62828; }
    .burst-dot  { background: #111; border-color: #fff; }
    .start-dot:hover, .finish-dot:hover, .burst-dot:hover { transform: scale(1.25); }

    /* Оранжево-чёрная тема приложения */
    :root {
      --ink: #080808;
      --ink-soft: #151515;
      --ink-muted: #242424;
      --orange: #ff7629;
      --orange-dark: #b94c12;
      --orange-soft: #ff9b61;
      --white-accent: #080808;
      --white-soft: #7d7d7d;
      --ascent-green: #3f9b58;
      --coral: #df715f;
      --paper: #f4f1ea;
      --muted: #aeb8be;
    }
    .card {
      background: var(--ink);
      border: 1px solid #2f2f2f;
      border-radius: 8px;
      box-shadow: 0 8px 28px rgba(0,0,0,.34);
      color: #fff;
    }
    #bubble { border-top: 3px solid #000; }
    #bubble p, #menu-header h2 { color: #fff; }
    #bubble-close, #menu-close {
      background: var(--ink-muted);
      color: var(--white-soft);
    }
    #bubble-close:hover, #menu-close:hover { background: #3a3a3a; }
    #menu {
      scrollbar-color: var(--white-soft) transparent;
      border-top: 3px solid #000;
    }
    #menu::-webkit-scrollbar-thumb { background: var(--white-soft); }
    .field-row label { color: var(--orange-soft); letter-spacing: 0; }
    .field-row label::before { color: #000; }
    .field-row input,
    .field-row select {
      border-color: #3a332e;
      border-radius: 6px;
      color: #fff;
      background: var(--ink-soft);
      color-scheme: dark;
    }
    .field-row input::placeholder { color: #777; }
    .field-row input:hover,
    .field-row select:hover { border-color: #555; }
    .field-row input:focus,
    .field-row select:focus {
      border-color: var(--orange);
      background: #1a1a1a;
      box-shadow: 0 0 0 2px rgba(255,118,41,.18);
    }
    .field-row input.input-error {
      border-color: #ff4d35;
      box-shadow: 0 0 0 2px rgba(255,77,53,.18);
    }
    .select-wrap::after { color: var(--white-soft); }
    .duration-conversion { color: var(--orange-soft); }
    .menu-sep { background: #333; }
    #result-section .result-coords span {
      background: #241b13;
      border-color: var(--orange-dark);
      border-radius: 6px;
      color: var(--orange-soft);
    }
    #btn-calc {
      border-radius: 6px;
      background: var(--orange);
      color: #080808;
      box-shadow: 0 5px 16px rgba(255,118,41,.24);
    }
    #btn-calc:hover:not(:disabled) { background: #ff8b4a; }
    #btn-calc:disabled { background: #665536; color: #adb3b6; }
    #btn-clear,
    #btn-export,
    #btn-export-kml {
      border-radius: 6px;
      border-color: #444;
      background: var(--ink-soft);
      color: #ddd;
    }
    #btn-export {
      background: #238a4f;
      border-color: #2fbf70;
      color: #fff;
    }
    #btn-export-kml {
      background: #2b5fae;
      border-color: #4f8ade;
      color: #fff;
    }
    #btn-clear:hover,
    #btn-export:hover { background: #293137; border-color: var(--white-soft); }
    #btn-export:hover {
      background: #2fbf70;
      border-color: #62d596;
      color: #111;
    }
    #btn-export-kml:hover {
      background: #4f8ade;
      border-color: #8ab6ec;
      color: #111;
    }
    #btn-menu-open {
      border-radius: 6px;
      border: 1px solid #333;
      background: var(--ink);
      color: var(--white-soft);
    }
    #btn-menu-open:hover { background: var(--ink-soft); }
    #status-bar {
      border-radius: 6px;
      border: 1px solid #3a3a3a;
      background: var(--ink);
      color: #fff;
    }
    #status-bar.error { color: #ff7b69; border-color: #8f3024; }
    #loading { background: rgba(10,10,10,.72); }
    .spinner { border-color: #344249; border-top-color: var(--white-accent); }
    #loading p { color: #fff; }
    #legend {
      border-radius: 6px;
      border: 1px solid #333;
      background: var(--ink);
    }
    .leg-item { color: #eee; }
    .start-dot { background: var(--ascent-green); }
    .finish-dot { background: var(--coral); border-color: #fff; }
    .burst-dot { background: #fff; border-color: #111; }
    @media (max-width: 700px) {
      #menu {
        display: none;
        top: 10px;
        left: 10px;
        right: 10px;
        bottom: 10px;
        width: auto;
        max-width: none;
        padding: 18px 16px;
      }
      #bubble { display: none; }
      #btn-menu-open { top: 10px; left: 12px; }
      .row-2 {
        grid-template-columns: 1fr;
        gap: 0;
      }
      input[type="date"],
      input[type="time"] {
        min-height: 44px;
        font-size: 16px;
      }
      #legend { right: 10px; bottom: 10px; }
      #status-bar {
        bottom: 12px;
        white-space: normal;
        width: calc(100% - 20px);
      }
    }
  </style>
</head>
<body>

<div id="map"></div>
<form id="csrf-form" style="display:none">{% csrf_token %}</form>

<!-- Экран загрузки -->
<div id="loading">
  <div class="spinner"></div>
  <p id="loading-msg">Загружаю данные ветра из NOAA GFS AWS…</p>
</div>

<!-- Приветственное окно -->
<div class="card" id="bubble">
  <p>Здравствуйте, здесь можно<br>рассчитать траекторию полёта!</p>
  <button id="bubble-close" onclick="closeBubble()">✕</button>
</div>

<!-- Левое меню -->
<div class="card" id="menu">
  <div class="menu-brand">
    <img src="{% static 'map_app/logo-white.png' %}" onerror="this.onerror=null; this.src='logo-white.png';" alt="Стратосферные системы" />
  </div>
  <div id="menu-header">
    <h2>Меню</h2>
    <button id="menu-close" onclick="toggleMenu()">✕</button>
  </div>

  <div class="field-row">
    <label>Широта</label>
    <input id="inp-lat" type="text" inputmode="decimal" placeholder="55.7558 или 55,7558" />
  </div>
  <div class="field-row">
    <label>Долгота</label>
    <input id="inp-lon" type="text" inputmode="decimal" placeholder="37.6176 или 37,6176" />
  </div>
  <div class="field-row">
    <label>Высота запуска (м)</label>
    <input id="inp-alt" type="text" inputmode="decimal" value="100" />
  </div>

  <div class="row-2">
    <div class="field-row">
      <label>Дата запуска</label>
      <input id="inp-date" type="date" />
    </div>
    <div class="field-row">
      <label>Время UTC</label>
      <input id="inp-time" type="time" value="06:00" />
    </div>
  </div>

  <div class="menu-sep"></div>

  <div class="field-row">
    <label>Скорость подъёма (м/с)</label>
    <input id="inp-ascent" type="text" inputmode="decimal" value="3" />
  </div>
  <div class="row-2">
    <div class="field-row" id="field-float-alt">
      <label>Высота дрейфа (м)</label>
      <input id="inp-float-alt" type="text" inputmode="decimal" value="5000" />
    </div>
    <div class="field-row" id="field-burst-alt">
      <label>Высота разрыва (м)</label>
      <input id="inp-burst" type="text" inputmode="decimal" value="30000" />
    </div>
  </div>
  <div class="field-row">
    <label>Скорость спуска (м/с)</label>
    <input id="inp-descent" type="text" inputmode="decimal" value="5" />
  </div>
  <div class="field-row">
    <label>Профиль полёта</label>
    <div class="select-wrap">
      <select id="inp-profile" onchange="toggleFloatDuration()">
        <option value="standard">Стандартный</option>
        <option value="float_profile">Дрейф</option>
      </select>
    </div>
  </div>
  <div class="field-row">
    <label>Сетка GFS</label>
    <div class="select-wrap">
      <select id="inp-gfs-mode">
        <option value="approx">Приближенная 1.0°</option>
        <option value="full">Точная 0.5°</option>
      </select>
    </div>
  </div>
  <div class="field-row" id="row-float-dur" style="display:none">
    <label>Макс. время дрейфа</label>
    <div class="duration-control">
      <input id="inp-float-dur" type="text" inputmode="decimal" value="172800" placeholder="172800" />
      <div class="select-wrap">
        <select id="inp-float-dur-unit">
          <option value="seconds">сек</option>
          <option value="hours">ч</option>
        </select>
      </div>
    </div>
    <div id="float-dur-conversion" class="duration-conversion">≈ 48 ч</div>
  </div>

  <!-- Результат -->
  <div id="result-section">
    <div class="menu-sep"></div>
    <div class="field-row" style="margin-bottom:0">
      <label>Координаты финиша</label>
      <div class="result-coords">
        <span id="res-lat">—</span>
        <span id="res-lon">—</span>
      </div>
    </div>
  </div>

  <button id="btn-calc" onclick="runPrediction()">Рассчитать траекторию</button>
  <button id="btn-export" onclick="downloadTrajectoryCsv()">Скачать Excel</button>
  <button id="btn-export-kml" onclick="downloadTrajectoryKml()">Скачать KML</button>
  <button id="btn-clear" onclick="clearTrajectory()">Очистить карту</button>
</div>

<!-- Кнопка открытия меню -->
<button id="btn-menu-open" onclick="toggleMenu()">☰</button>

<!-- Строка состояния -->
<div id="status-bar"></div>

<!-- Легенда фаз -->
<div id="legend">
  <div class="leg-item"><div class="leg-dot" style="background:#3f9b58"></div>Подъём</div>
  <div class="leg-item"><div class="leg-dot" style="background:#ff7629"></div>Дрейф</div>
  <div class="leg-item"><div class="leg-dot" style="background:#df715f"></div>Спуск</div>
</div>

<script>
// ─────────────── Инициализация карты ──────────────
let map, trajCollection, balloonLayout;

// API Яндекса подключается асинхронно, поэтому всё, что трогает карту,
// ждёт init(). Стартовая точка из query-параметров копится здесь.
let mapReady = false;
let pendingStart = null;

ymaps.ready(init);
function init() {
    balloonLayout = makeBalloonLayout();
    map = new ymaps.Map("map", {
        center: [55.76, 37.64],
        controls: ['typeSelector', 'rulerControl'],
        zoom: 7
    },{
        yandexMapDisablePoiInteractivity: true,
        suppressMapOpenBlock: true,
        maxZoom: 14,
        minZoom: 7
    });
    trajCollection = new ymaps.GeoObjectCollection();
    map.geoObjects.add(trajCollection);
    map.events.add('click', e => {
        const [lat, lon] = e.get('coords').map(v => +v.toFixed(4));
        document.getElementById('inp-lat').value = lat;
        document.getElementById('inp-lon').value = lon;
        placeStartMarker(lat, lon);
    });
    mapReady = true;

    // Отложенные до готовности карты действия: точка старта из ссылки
    // и, если параметры расчёта заданы, автоматический запуск.
    if (pendingStart) {
        placeStartMarker(pendingStart.lat, pendingStart.lon);
        map.setCenter([pendingStart.lat, pendingStart.lon], 8);
        pendingStart = null;
    }
    if (hasPredictParams) runPrediction();
}
// ─────────────── Состояние ──────────────────────
let startMarker = null;
let landMarker  = null;
let burstMarker = null;
let lastTrajectory = [];

const todayUtc = new Date();
const earliestHistoryDate = new Date(todayUtc);
earliestHistoryDate.setUTCDate(
  earliestHistoryDate.getUTCDate() - 8
);
const latestForecastDate = new Date(todayUtc);
latestForecastDate.setUTCDate(
  latestForecastDate.getUTCDate() + 15
);
const dateInput = document.getElementById('inp-date');
dateInput.value = todayUtc.toISOString().slice(0, 10);
dateInput.min = earliestHistoryDate.toISOString().slice(0, 10);
dateInput.max = latestForecastDate.toISOString().slice(0, 10);

function parsePredictNumber(value, fallback) {
  if (typeof value === 'number') return Number.isFinite(value) ? value : fallback;
  const normalized = String(value ?? '')
    .trim()
    .replace(/\s+/g, '')
    .replace(',', '.');
  if (!normalized || !/^[+-]?(?:\d+(?:\.\d*)?|\.\d+)$/.test(normalized)) return fallback;
  const parsed = Number(normalized);
  return Number.isFinite(parsed) ? parsed : fallback;
}

function readNumber(id, fallback, min = -Infinity, max = Infinity) {
  const input = document.getElementById(id);
  const value = parsePredictNumber(input.value, NaN);
  const valid = Number.isFinite(value) && value >= min && value <= max;
  input.classList.toggle('input-error', !valid);
  return valid ? value : fallback;
}

function setFloatDurationSeconds(totalSeconds) {
  const input = document.getElementById('inp-float-dur');
  const unit = document.getElementById('inp-float-dur-unit');
  if (!input || !unit) return;
  unit.value = 'seconds';
  input.value = String(Math.max(0, Math.round(totalSeconds)));
  syncFloatDurationConversion();
}

function readDurationSeconds(id, fallbackSeconds) {
  const input = document.getElementById(id);
  const unit = document.getElementById(`${id}-unit`)?.value || 'seconds';
  const rawValue = parsePredictNumber(input.value, NaN);
  const seconds = unit === 'hours' ? rawValue * 3600 : rawValue;
  const valid = Number.isFinite(seconds) && seconds > 0;
  input.classList.toggle('input-error', !valid);
  return valid ? seconds : fallbackSeconds;
}

function formatCompactNumber(value, digits = 2) {
  if (!Number.isFinite(value)) return '—';
  return Number(value.toFixed(digits)).toLocaleString('ru-RU');
}

function syncFloatDurationConversion() {
  const input = document.getElementById('inp-float-dur');
  const unit = document.getElementById('inp-float-dur-unit');
  const output = document.getElementById('float-dur-conversion');
  if (!input || !unit || !output) return;

  const rawValue = parsePredictNumber(input.value, NaN);
  const valid = Number.isFinite(rawValue) && rawValue > 0;
  input.classList.toggle('input-error', !valid);

  if (!valid) {
    output.textContent = 'Введите положительное число';
    return;
  }

  if (unit.value === 'hours') {
    output.textContent = `= ${Math.round(rawValue * 3600).toLocaleString('ru-RU')} сек`;
  } else {
    output.textContent = `≈ ${formatCompactNumber(rawValue / 3600)} ч`;
  }
}

function formatCsvNumber(value, digits = 6) {
  if (!Number.isFinite(value)) return '';
  return Number(value).toFixed(digits).replace('.', ',');
}

function formatCoordinateDms(value, positiveSuffix, negativeSuffix) {
  if (!Number.isFinite(value)) return '';
  const suffix = value >= 0 ? positiveSuffix : negativeSuffix;
  const absolute = Math.abs(value);
  const degrees = Math.floor(absolute);
  const minutesFloat = (absolute - degrees) * 60;
  const minutes = Math.floor(minutesFloat);
  const seconds = (minutesFloat - minutes) * 60;
  return `${degrees}° ${String(minutes).padStart(2, '0')}' ${seconds.toFixed(2).replace('.', ',')}" ${suffix}`;
}

// Румбы и стрелки для подписи направления сноса.
const COMPASS_RHUMBS = [
  'С', 'ССВ', 'СВ', 'ВСВ', 'В', 'ВЮВ', 'ЮВ', 'ЮЮВ',
  'Ю', 'ЮЮЗ', 'ЮЗ', 'ЗЮЗ', 'З', 'ЗСЗ', 'СЗ', 'ССЗ',
];
const COMPASS_ARROWS = ['↑', '↗', '→', '↘', '↓', '↙', '←', '↖'];

function formatBearing(bearing) {
  const deg = ((bearing % 360) + 360) % 360;
  const arrow = COMPASS_ARROWS[Math.round(deg / 45) % 8];
  const rhumb = COMPASS_RHUMBS[Math.round(deg / 22.5) % 16];
  return `${arrow} ${rhumb}`;
}

// Горизонтальная скорость и направление сноса: шар летит вместе с ветром,
// поэтому берём смещение между соседними точками траектории.
function trackMotion(points, index) {
  const from = points[index - 1] || points[index];
  const to   = points[index + 1] || points[index];
  if (from === to) return null;
  const seconds = (Date.parse(to.time || '') - Date.parse(from.time || '')) / 1000;
  if (!Number.isFinite(seconds) || seconds <= 0) return null;

  const R = 6371000;
  const midLat = (from.lat + to.lat) / 2 * Math.PI / 180;
  const dy = (to.lat - from.lat) * Math.PI / 180 * R;
  const dx = (to.lon - from.lon) * Math.PI / 180 * R * Math.cos(midLat);
  return {
    speed: Math.hypot(dx, dy) / seconds,
    bearing: Math.atan2(dx, dy) * 180 / Math.PI,
  };
}

// Блок координат для балуна: десятичные градусы, градусы/минуты/секунды
// и прямоугольные координаты СК-42 (Гаусса-Крюгера).
function balloonCoordinates(lat, lon) {
  const gk = toSk42Gk(lat, lon);
  return `Широта: <b>${lat.toFixed(4)}</b><br>Долгота: <b>${lon.toFixed(4)}</b><br>` +
    `Широта (DMS): <b>${formatCoordinateDms(lat, 'N', 'S')}</b><br>` +
    `Долгота (DMS): <b>${formatCoordinateDms(lon, 'E', 'W')}</b><br>` +
    `СК-42, зона ${gk.zone}:<br>` +
    `X = <b>${fmtMeters(gk.x)}</b><br>Y = <b>${fmtMeters(gk.y)}</b><br>`;
}

function balloonMotion(points, index) {
  const motion = trackMotion(points, index);
  if (!motion) return '';
  return `Скорость / Напр.: <b>${motion.speed.toFixed(1)} м/с ${formatBearing(motion.bearing)}</b><br>`;
}

function csvCell(value) {
  const text = String(value ?? '');
  return /[;"\r\n]/.test(text) ? `"${text.replace(/"/g, '""')}"` : text;
}

function flightSecond(point, firstTime, index) {
  const currentTime = Date.parse(point.time || '');
  if (Number.isFinite(currentTime) && Number.isFinite(firstTime)) {
    return Math.max(0, Math.round((currentTime - firstTime) / 1000));
  }
  return index * 60;
}

function downloadTrajectoryCsv() {
  if (!lastTrajectory.length) {
    showStatus('Сначала рассчитайте траекторию', true);
    return;
  }

  const firstTime = Date.parse(lastTrajectory[0].time || '');
  const rows = [
    [
      'Секунда полета',
      'Высота, м',
      'Широта (градусы минуты секунды)',
      'Долгота (градусы минуты секунды)',
      'Широта (десятичная)',
      'Долгота (десятичная)',
    ],
  ];

  lastTrajectory.forEach((point, index) => {
    rows.push([
      flightSecond(point, firstTime, index),
      formatCsvNumber(point.alt, 1),
      formatCoordinateDms(point.lat, 'N', 'S'),
      formatCoordinateDms(point.lon, 'E', 'W'),
      formatCsvNumber(point.lat, 8),
      formatCsvNumber(point.lon, 8),
    ]);
  });

  const csv = '\ufeff' + rows
    .map(row => row.map(csvCell).join(';'))
    .join('\r\n');
  downloadBlob(new Blob([csv], { type: 'text/csv;charset=utf-8;' }), `trajectory_${exportStamp()}.csv`);
}

function exportStamp() {
  return new Date().toISOString().slice(0, 19).replace(/:/g, '-');
}

function downloadBlob(blob, filename) {
  const url = URL.createObjectURL(blob);
  const link = document.createElement('a');
  link.href = url;
  link.download = filename;
  document.body.appendChild(link);
  link.click();
  link.remove();
  URL.revokeObjectURL(url);
}

// ─────────────── Экспорт KML ─────────────────────
const PHASE_TITLES = { ascent: 'Подъём', float: 'Дрейф', descent: 'Спуск' };

// Стандартные иконки Google Earth: свои картинки хостить негде,
// а эти понимает любой просмотрщик KML.
const KML_ICON_DOT    = 'http://maps.google.com/mapfiles/kml/shapes/placemark_circle.png';
const KML_ICON_START  = 'http://maps.google.com/mapfiles/kml/paddle/grn-circle.png';
const KML_ICON_BURST  = 'http://maps.google.com/mapfiles/kml/paddle/wht-circle.png';
const KML_ICON_FINISH = 'http://maps.google.com/mapfiles/kml/paddle/red-circle.png';

function xmlEscape(value) {
  return String(value ?? '')
    .replace(/&/g, '&amp;')
    .replace(/</g, '&lt;')
    .replace(/>/g, '&gt;')
    .replace(/"/g, '&quot;')
    .replace(/'/g, '&apos;');
}

// KML хранит цвет как aabbggrr, поэтому байты #rrggbb разворачиваем.
function kmlColor(hex, alpha = 'ff') {
  const rgb = hex.replace('#', '');
  return (alpha + rgb.slice(4, 6) + rgb.slice(2, 4) + rgb.slice(0, 2)).toLowerCase();
}

// KML ждёт dateTime по XML-схеме, доли секунды из расчёта здесь лишние.
function kmlTime(point) {
  const parsed = Date.parse(point.time || '');
  if (!Number.isFinite(parsed)) return '';
  return new Date(parsed).toISOString().replace(/\.\d+Z$/, 'Z');
}

function kmlCoord(point) {
  return `${point.lon.toFixed(8)},${point.lat.toFixed(8)},${point.alt.toFixed(1)}`;
}

// Тот же текст, что и в балуне на карте: Google Earth рендерит его как HTML.
function kmlDescription(points, index, header = '') {
  const p = points[index];
  const body = (header ? `${header}<br>` : '')
    + `Фаза: <b>${PHASE_TITLES[p.phase] || p.phase}</b><br>`
    + `Высота: <b>${Math.round(p.alt)} м</b><br>`
    + balloonCoordinates(p.lat, p.lon)
    + balloonMotion(points, index)
    + `Время: <b>${(p.time || '').replace('T', ' ').replace('Z', '')} UTC</b>`;
  return `<![CDATA[${body.replace(/]]>/g, ']]&gt;')}]]>`;
}

function kmlPlacemark(points, index, { name, styleId, header = '' }) {
  const stamp = kmlTime(points[index]);
  return '    <Placemark>\n'
    + `      <name>${xmlEscape(name)}</name>\n`
    + `      <description>${kmlDescription(points, index, header)}</description>\n`
    + `      <styleUrl>#${styleId}</styleUrl>\n`
    + (stamp ? `      <TimeStamp><when>${stamp}</when></TimeStamp>\n` : '')
    + '      <Point>\n'
    + '        <altitudeMode>absolute</altitudeMode>\n'
    + `        <coordinates>${kmlCoord(points[index])}</coordinates>\n`
    + '      </Point>\n'
    + '    </Placemark>\n';
}

function kmlStyles() {
  const phaseStyles = ['ascent', 'float', 'descent'].map(phase => {
    const color = kmlColor(phaseColor(phase));
    return `  <Style id="line-${phase}">\n`
      + `    <LineStyle><color>${color}</color><width>3.5</width></LineStyle>\n`
      + `    <PolyStyle><color>${kmlColor(phaseColor(phase), '33')}</color></PolyStyle>\n`
      + '  </Style>\n'
      + `  <Style id="dot-${phase}">\n`
      + `    <IconStyle><color>${color}</color><scale>0.7</scale>`
      + `<Icon><href>${KML_ICON_DOT}</href></Icon></IconStyle>\n`
      + '    <LabelStyle><scale>0</scale></LabelStyle>\n'
      + '  </Style>\n';
  }).join('');

  const pinStyle = (id, href) => `  <Style id="${id}">\n`
    + `    <IconStyle><scale>1.1</scale><Icon><href>${href}</href></Icon>`
    + '<hotSpot x="32" y="1" xunits="pixels" yunits="pixels"/></IconStyle>\n'
    + '  </Style>\n';

  return phaseStyles
    + pinStyle('pin-start', KML_ICON_START)
    + pinStyle('pin-burst', KML_ICON_BURST)
    + pinStyle('pin-finish', KML_ICON_FINISH);
}

function buildTrajectoryKml(points) {
  const last = points[points.length - 1];
  let burstIndex = -1;
  for (let k = points.length - 1; k >= 0; k--) {
    if (points[k].phase === 'ascent') { burstIndex = k; break; }
  }

  // ── Линия трека, разбитая по фазам ──
  const lines = phaseSegments(points).map(segment =>
    '    <Placemark>\n'
    + `      <name>${xmlEscape(PHASE_TITLES[segment.phase] || segment.phase)}</name>\n`
    + `      <styleUrl>#line-${segment.phase}</styleUrl>\n`
    + '      <LineString>\n'
    + '        <extrude>1</extrude>\n'
    + '        <tessellate>1</tessellate>\n'
    + '        <altitudeMode>absolute</altitudeMode>\n'
    + `        <coordinates>${segment.points.map(kmlCoord).join(' ')}</coordinates>\n`
    + '      </LineString>\n'
    + '    </Placemark>\n'
  ).join('');

  // ── Ключевые точки ──
  let keyPoints = kmlPlacemark(points, 0, { name: 'Старт', styleId: 'pin-start' });
  if (burstIndex >= 0 && burstIndex !== points.length - 1) {
    keyPoints += kmlPlacemark(points, burstIndex, { name: 'Точка разрыва', styleId: 'pin-burst' });
  }
  keyPoints += kmlPlacemark(points, points.length - 1, { name: 'Точка финиша', styleId: 'pin-finish' });

  // ── Промежуточные точки: тот же шаг, что и на карте ──
  const firstTime = Date.parse(points[0].time || '');
  const step = 5;
  let marks = '';
  for (let k = step; k < points.length - step; k += step) {
    marks += kmlPlacemark(points, k, {
      name: `T+${flightSecond(points[k], firstTime, k)} с`,
      styleId: `dot-${points[k].phase}`,
      header: 'Промежуточная точка',
    });
  }

  // ── Трек с временем: Google Earth умеет проигрывать полёт ──
  const track = points.every(p => kmlTime(p))
    ? '    <Placemark>\n'
      + '      <name>Анимация полёта</name>\n'
      + '      <styleUrl>#line-ascent</styleUrl>\n'
      + '      <gx:Track>\n'
      + '        <altitudeMode>absolute</altitudeMode>\n'
      + points.map(p => `        <when>${kmlTime(p)}</when>\n`).join('')
      + points.map(p => `        <gx:coord>${kmlCoord(p).replace(/,/g, ' ')}</gx:coord>\n`).join('')
      + '      </gx:Track>\n'
      + '    </Placemark>\n'
    : '';

  const title = `Траектория зонда ${(points[0].time || '').replace('T', ' ').replace('Z', '')} UTC`;
  const summary = `Точек: ${points.length} · финиш ${last.lat.toFixed(4)}, ${last.lon.toFixed(4)}`;

  return '<?xml version="1.0" encoding="UTF-8"?>\n'
    + '<kml xmlns="http://www.opengis.net/kml/2.2" xmlns:gx="http://www.google.com/kml/ext/2.2">\n'
    + '<Document>\n'
    + `  <name>${xmlEscape(title)}</name>\n`
    + `  <description>${xmlEscape(summary)}</description>\n`
    + kmlStyles()
    + '  <Folder>\n    <name>Траектория</name>\n' + lines + '  </Folder>\n'
    + '  <Folder>\n    <name>Ключевые точки</name>\n' + keyPoints + '  </Folder>\n'
    + '  <Folder>\n    <name>Промежуточные точки</name>\n    <open>0</open>\n' + marks + '  </Folder>\n'
    + (track ? '  <Folder>\n    <name>Анимация</name>\n    <visibility>0</visibility>\n' + track + '  </Folder>\n' : '')
    + '</Document>\n</kml>\n';
}

function downloadTrajectoryKml() {
  if (!lastTrajectory.length) {
    showStatus('Сначала рассчитайте траекторию', true);
    return;
  }

  downloadBlob(
    new Blob([buildTrajectoryKml(lastTrajectory)], {
      type: 'application/vnd.google-earth.kml+xml;charset=utf-8;',
    }),
    `trajectory_${exportStamp()}.kml`,
  );
}

// Полностью кастомный макет всплывающего окна: тёмная карточка
// с кнопкой закрытия и «хвостиком», указывающим на точку.
function makeBalloonLayout() {
  const Layout = ymaps.templateLayoutFactory.createClass(
    '<div class="ymap-balloon">' +
      '<button type="button" class="ymap-balloon__close">&times;</button>' +
      '<div class="popup-title">$[properties.balloonContentHeader]</div>' +
      '<div class="popup-row">$[properties.balloonContentBody]</div>' +
      '<div class="ymap-balloon__tail"></div>' +
    '</div>',
    {
      build: function () {
        Layout.superclass.build.call(this);
        this._el = this.getParentElement().querySelector('.ymap-balloon');
        this._onClose = e => {
          e.preventDefault();
          this.events.fire('userclose');
        };
        this._el.querySelector('.ymap-balloon__close')
          .addEventListener('click', this._onClose);
        // Ставим балун по центру над точкой
        this._el.style.left = -(this._el.offsetWidth / 2) + 'px';
        this._el.style.top = -(this._el.offsetHeight + 18) + 'px';
      },
      clear: function () {
        this._el.querySelector('.ymap-balloon__close')
          .removeEventListener('click', this._onClose);
        Layout.superclass.clear.call(this);
      },
      // Область балуна — чтобы карта сама сдвигалась, если он не влезает
      getShape: function () {
        if (!this._el) return Layout.superclass.getShape.call(this);
        const w = this._el.offsetWidth, h = this._el.offsetHeight;
        return new ymaps.shape.Rectangle(
          new ymaps.geometry.pixel.Rectangle([[-w / 2, -(h + 18)], [w / 2, -18]])
        );
      },
    }
  );
  return Layout;
}

// ─────────────── Работа с маркерами ─────────────
// Маркер-точка как встроенный SVG: цветной кружок с белой каймой.
// Рендерится прямо на canvas карты, не зависит от внешнего CSS.
// size — диаметр в пикселях: ~22 для ключевых точек, ~11 для промежуточных.
function dotIcon(fill, stroke, size = 22) {
  const c = size / 2;
  const big = size >= 18;
  const r = c - (big ? 3 : 1.5);
  const sw = big ? 2.5 : 1.5;
  const svg =
    `<svg xmlns="http://www.w3.org/2000/svg" width="${size}" height="${size}" viewBox="0 0 ${size} ${size}">` +
      `<circle cx="${c}" cy="${c}" r="${r}" fill="${fill}" stroke="${stroke}" stroke-width="${sw}"/>` +
    `</svg>`;
  return {
    iconLayout: 'default#image',
    iconImageHref: 'data:image/svg+xml;charset=utf-8,' + encodeURIComponent(svg),
    iconImageSize: [size, size],
    iconImageOffset: [-c, -c],
    // Свой балун вместо стандартного белого
    balloonLayout: balloonLayout,
    balloonPanelMaxMapArea: 0,
  };
}

// ─────────────── Маркер точки старта ────────────
function placeStartMarker(lat, lon) {
  if (startMarker) map.geoObjects.remove(startMarker);
  startMarker = new ymaps.Placemark([lat, lon], {
    balloonContentHeader: 'Точка старта',
    balloonContentBody: balloonCoordinates(lat, lon),
  }, dotIcon('#3f9b58', '#ffffff'));
  map.geoObjects.add(startMarker);
}

// ─────────────── Приветственное окно ────────────
function applyPredictQueryParams() {
  const params = new URLSearchParams(window.location.search);
  if (!params.size) return false;

  const lat = parsePredictNumber(params.get('launch_latitude'), NaN);
  const lon = parsePredictNumber(params.get('launch_longitude'), NaN);
  const altitude = parsePredictNumber(params.get('launch_altitude'), 100);
  const ascentRate = parsePredictNumber(params.get('ascent_rate'), 3);
  const floatAltitude = parsePredictNumber(params.get('float_altitude'), 5000);
  const burstAltitude = parsePredictNumber(params.get('burst_altitude'), 30000);
  const descentRate = parsePredictNumber(params.get('descent_rate'), 5);
  const maxFloatSeconds = parsePredictNumber(params.get('max_float_seconds'), NaN);
  const maxFloatHours = parsePredictNumber(params.get('max_float_hours'), 48);
  const profile = params.get('profile') || 'standard';
  const gfsMode = params.get('gfs_mode') || 'approx';
  const launchDateTime = params.get('launch_datetime');

  if (Number.isFinite(lat)) document.getElementById('inp-lat').value = lat.toFixed(4);
  if (Number.isFinite(lon)) document.getElementById('inp-lon').value = lon.toFixed(4);
  document.getElementById('inp-alt').value = altitude;
  document.getElementById('inp-ascent').value = ascentRate;
  document.getElementById('inp-float-alt').value = floatAltitude;
  document.getElementById('inp-burst').value = burstAltitude;
  document.getElementById('inp-descent').value = descentRate;
  if (Number.isFinite(maxFloatSeconds)) {
    setFloatDurationSeconds(maxFloatSeconds);
  } else {
    setFloatDurationSeconds(maxFloatHours * 3600);
  }
  document.getElementById('inp-profile').value = profile === 'float_profile' ? 'float_profile' : 'standard';
  document.getElementById('inp-gfs-mode').value = gfsMode === 'full' ? 'full' : 'approx';

  if (launchDateTime) {
    const dt = new Date(launchDateTime);
    if (!Number.isNaN(dt.getTime())) {
      document.getElementById('inp-date').value = dt.toISOString().slice(0, 10);
      document.getElementById('inp-time').value = dt.toISOString().slice(11, 16);
    }
  }

  if (Number.isFinite(lat) && Number.isFinite(lon)) {
    // Карты ещё нет — маркер поставит init().
    pendingStart = { lat, lon };
    return true;
  }

  return false;
}

// ─────────────── Цвета фаз ──────────────────────
function phaseColor(phase) {
  if (phase === 'ascent')  return '#3f9b58';
  if (phase === 'float')   return '#ff7629';
  if (phase === 'descent') return '#df715f';
  return '#87959d';
}

// ─────────────── Пересчёт координат (СК-42) ──────
const ELL_WGS84 = { a: 6378137.0,  f: 1 / 298.257223563 };
const ELL_KRASS = { a: 6378245.0,  f: 1 / 298.3 };

// Параметры перехода СК-42 → WGS-84 (ГОСТ Р 51794-2001)
const SK42_TO_WGS = {
  dx: 23.92, dy: -141.27, dz: -80.9,
  wx: 0, wy: -0.35, wz: -0.79,   // угловые секунды
  m: -0.22e-6
};

function geodeticToEcef(latDeg, lonDeg, h, ell) {
  const e2 = ell.f * (2 - ell.f);
  const B = latDeg * Math.PI / 180, L = lonDeg * Math.PI / 180;
  const N = ell.a / Math.sqrt(1 - e2 * Math.sin(B) ** 2);
  return [
    (N + h) * Math.cos(B) * Math.cos(L),
    (N + h) * Math.cos(B) * Math.sin(L),
    (N * (1 - e2) + h) * Math.sin(B),
  ];
}

function ecefToGeodetic(X, Y, Z, ell) {
  const e2 = ell.f * (2 - ell.f);
  const L = Math.atan2(Y, X);
  const p = Math.hypot(X, Y);
  let B = Math.atan2(Z, p * (1 - e2)), h = 0;
  for (let i = 0; i < 8; i++) {
    const N = ell.a / Math.sqrt(1 - e2 * Math.sin(B) ** 2);
    h = p / Math.cos(B) - N;
    B = Math.atan2(Z, p * (1 - e2 * N / (N + h)));
  }
  return [B * 180 / Math.PI, L * 180 / Math.PI, h];
}

// Обратное преобразование Гельмерта: WGS-84 → СК-42
function wgs84ToSk42Geodetic(latDeg, lonDeg, h = 0) {
  const S = Math.PI / 180 / 3600;
  const wx = SK42_TO_WGS.wx * S, wy = SK42_TO_WGS.wy * S, wz = SK42_TO_WGS.wz * S;
  const [X, Y, Z] = geodeticToEcef(latDeg, lonDeg, h, ELL_WGS84);
  const k = 1 / (1 + SK42_TO_WGS.m);
  const x = (X - SK42_TO_WGS.dx) * k;
  const y = (Y - SK42_TO_WGS.dy) * k;
  const z = (Z - SK42_TO_WGS.dz) * k;
  return ecefToGeodetic(
    x - wz * y + wy * z,
    wz * x + y - wx * z,
    -wy * x + wx * y + z,
    ELL_KRASS
  );
}

// Поперечная проекция Меркатора (общая для Гаусса-Крюгера и UTM)
function transverseMercator(latDeg, lonDeg, lon0Deg, k0, ell) {
  const e2 = ell.f * (2 - ell.f);
  const ep2 = e2 / (1 - e2);
  const B = latDeg * Math.PI / 180;
  let dl = lonDeg - lon0Deg;
  if (dl > 180) dl -= 360;
  if (dl < -180) dl += 360;
  const l = dl * Math.PI / 180;
  const N = ell.a / Math.sqrt(1 - e2 * Math.sin(B) ** 2);
  const T = Math.tan(B) ** 2;
  const C = ep2 * Math.cos(B) ** 2;
  const A = Math.cos(B) * l;
  const M = ell.a * (
    (1 - e2 / 4 - 3 * e2 ** 2 / 64 - 5 * e2 ** 3 / 256) * B
    - (3 * e2 / 8 + 3 * e2 ** 2 / 32 + 45 * e2 ** 3 / 1024) * Math.sin(2 * B)
    + (15 * e2 ** 2 / 256 + 45 * e2 ** 3 / 1024) * Math.sin(4 * B)
    - (35 * e2 ** 3 / 3072) * Math.sin(6 * B)
  );
  const northing = k0 * (M + N * Math.tan(B) * (
    A ** 2 / 2
    + (5 - T + 9 * C + 4 * C ** 2) * A ** 4 / 24
    + (61 - 58 * T + T ** 2 + 600 * C - 330 * ep2) * A ** 6 / 720
  ));
  const easting = k0 * N * (
    A
    + (1 - T + C) * A ** 3 / 6
    + (5 - 18 * T + T ** 2 + 72 * C - 58 * ep2) * A ** 5 / 120
  );
  return { easting, northing };
}

// СК-42 / Гаусса-Крюгера, 6-градусные зоны
function toSk42Gk(latWgs, lonWgs) {
  const [lat, lon] = wgs84ToSk42Geodetic(latWgs, lonWgs, 0);
  const east = ((lon % 360) + 360) % 360;   // долгота 0…360° к востоку от Гринвича
  const zone = Math.floor(east / 6) + 1;    // зоны СК-42 нумеруются от Гринвича
  const lon0 = zone * 6 - 3;
  const { easting, northing } = transverseMercator(lat, east, lon0, 1, ELL_KRASS);
  return { zone, x: northing, y: zone * 1e6 + 500000 + easting };
}

const fmtMeters = v => Math.round(v).toString().replace(/\B(?=(\d{3})+(?!\d))/g, '\u202F');

// ─────────────── Опрос фоновой задачи ───────────
const POLL_INTERVAL_MS = 1000;
const POLL_TIMEOUT_MS  = 15 * 60 * 1000;   // столько же, сколько job_timeout на сервере

function sleep(ms) { return new Promise(r => setTimeout(r, ms)); }

// Спрашивает статус раз в секунду, пока расчёт не закончится.
// Возвращает готовый ответ сервера либо бросает ошибку с понятным текстом.
async function pollPrediction(taskId, baseMsg) {
  // Django подставляет путь с заглушкой, JS меняет её на настоящий id.
  // Так URL остаётся верным и при деплое в подкаталог (FORCE_SCRIPT_NAME).
  const statusUrl = "{% url 'predict_status' 'TASK_ID' %}".replace('TASK_ID', taskId);
  const startedAt = Date.now();

  while (Date.now() - startedAt < POLL_TIMEOUT_MS) {
    await sleep(POLL_INTERVAL_MS);

    const res = await fetch(statusUrl);
    if (res.status === 404) throw new Error('Задача не найдена или устарела');
    if (!res.ok)            throw new Error(`Сервер вернул ошибку ${res.status}`);

    const data = await res.json();

    if (data.status === 'finished') return data;
    if (data.status === 'failed')   throw new Error(data.error || 'Расчёт не удался');

    const secs = Math.round((Date.now() - startedAt) / 1000);
    document.getElementById('loading-msg').textContent = data.status === 'running'
      ? `${baseMsg} · ${secs} с`
      : `Ожидаю свободный обработчик… · ${secs} с`;
  }

  throw new Error('Расчёт занял слишком много времени');
}

// ─────────────── Запуск расчёта ─────────────────
async function runPrediction() {
  const lat = readNumber('inp-lat', NaN, -90, 90);
  const lon = readNumber('inp-lon', NaN, -180, 180);

  if (!Number.isFinite(lat) || !Number.isFinite(lon)) {
    showStatus('Кликните на карту или введите координаты старта', true);
    return;
  }

  clearTrajectory(false);
  placeStartMarker(lat, lon);

  document.getElementById('loading').classList.add('show');
  document.getElementById('btn-calc').disabled = true;

  try {
    const maxFloatSeconds = readDurationSeconds('inp-float-dur', 172800);

    const body = {
      latitude:       lat,
      longitude:      lon,
      altitude:       readNumber('inp-alt', 100, 0),
      launch_date:    document.getElementById('inp-date').value,
      launch_time:    document.getElementById('inp-time').value,
      ascent_rate:      readNumber('inp-ascent', 3, 0.1),
      float_altitude:   readNumber('inp-float-alt', 5000, 100, 45000),
      burst_altitude:   readNumber('inp-burst', 30000, 1000, 50000),
      descent_rate:     readNumber('inp-descent', 5, 0.1),
      profile:          document.getElementById('inp-profile').value,
      max_float_seconds: maxFloatSeconds,
      gfs_mode:         document.getElementById('inp-gfs-mode').value,
    };
    const targetAltitude = body.profile === 'float_profile'
      ? body.float_altitude
      : body.burst_altitude;
    const ascentHours = Math.max(0, targetAltitude - body.altitude) / body.ascent_rate / 3600;
    const driftHours = body.profile === 'float_profile' ? body.max_float_seconds / 3600 : 0;
    const estimatedHours = ascentHours + driftHours
      + targetAltitude / body.descent_rate / 3600;
    const forecastSlices = Math.ceil(estimatedHours / 3) + 2;
    const modeLabel = body.gfs_mode === 'full' ? 'точная сетка 0.5°' : 'приближенная сетка 1.0°';
    document.getElementById('loading-msg').textContent = estimatedHours > 12
      ? `Медленный полёт: около ${Math.round(estimatedHours)} ч · ${modeLabel} · подготавливаю до ${forecastSlices} прогнозов GFS…`
      : `Загружаю данные ветра GFS · ${modeLabel}…`;

    // Сообщение, собранное выше, служит основой для строки прогресса.
    const baseMsg = document.getElementById('loading-msg').textContent;

    // 1. Ставим расчёт в очередь — сервер отвечает сразу, не дожидаясь результата.
    const startRes = await fetch("{% url 'predict_start' %}", {
      method: 'POST',
      headers: { 'Content-Type': 'application/json', 'X-CSRFToken': getCsrfToken() },
      body: JSON.stringify(body),
    });

    let startData = null;
    try {
      startData = JSON.parse(await startRes.text());
    } catch {
      throw new Error(startRes.status === 403
        ? 'Сессия устарела. Обновите страницу и повторите расчет.'
        : `Сервер вернул ошибку ${startRes.status}`);
    }
    if (!startRes.ok || startData.error || !startData.task_id) {
      throw new Error(startData.error || `Ошибка сервера ${startRes.status}`);
    }

    // 2. Ждём результат, опрашивая статус задачи.
    const data = await pollPrediction(startData.task_id, baseMsg);

    drawTrajectory(data.trajectory, lat, lon);

    const inf = data.info || {};
    const gridText = inf.grid ? ` · сетка ${inf.grid}` : '';
    showStatus(`Траектория готова · ${inf.source || 'NOAA GFS AWS'}${gridText} · ${data.trajectory.length} точек`);

  } catch (err) {
    showStatus('Ошибка: ' + err.message, true);
  } finally {
    document.getElementById('loading').classList.remove('show');
    document.getElementById('btn-calc').disabled = false;
  }
}

// Режем трек на отрезки по фазам; отрезок захватывает первую точку следующей
// фазы, чтобы линия не рвалась на границе.
function phaseSegments(points) {
  const segments = [];
  let i = 0;
  while (i < points.length - 1) {
    const phase = points[i].phase;
    let j = i + 1;
    while (j < points.length && points[j].phase === phase) j++;
    segments.push({ phase, points: points.slice(i, Math.min(j + 1, points.length)) });
    i = j;
  }
  return segments;
}

// ─────────────── Отрисовка траектории ───────────
function drawTrajectory(points, startLat, startLon) {
  if (!points || !points.length) return;
  lastTrajectory = points;
  document.getElementById('btn-export').style.display = 'block';
  document.getElementById('btn-export-kml').style.display = 'block';

  // ── Отрезки по фазам (координаты [широта, долгота]) ──
  phaseSegments(points).forEach(segment => {
    trajCollection.add(new ymaps.Polyline(
      segment.points.map(p => [p.lat, p.lon]),
      {},
      {
        strokeColor: phaseColor(segment.phase),
        strokeWidth: 3.5,
        strokeOpacity: 0.88,
      },
    ));
  });

  // ── Промежуточные точки (каждая 5-я) с балуном ──
  const step = 5;
  for (let k = step; k < points.length - step; k += step) {
    const p = points[k];
    trajCollection.add(new ymaps.Placemark([p.lat, p.lon], {
      balloonContentHeader: 'Промежуточная точка',
      balloonContentBody:
        `Высота: <b>${Math.round(p.alt)} м</b><br>` +
        balloonCoordinates(p.lat, p.lon) +
        balloonMotion(points, k) +
        `Время: <b>${(p.time || '').replace('T', ' ').replace('Z', '')} UTC</b>`,
    }, dotIcon(phaseColor(p.phase), '#ffffff', 16)));
  }

  // ── Маркер разрыва (последняя точка подъёма) ──
  let burstIdx = -1;
  for (let k = points.length - 1; k >= 0; k--) {
    if (points[k].phase === 'ascent') { burstIdx = k; break; }
  }
  const burstPt = burstIdx >= 0 ? points[burstIdx] : null;
  if (burstMarker) map.geoObjects.remove(burstMarker);
  if (burstPt) {
    burstMarker = new ymaps.Placemark([burstPt.lat, burstPt.lon], {
      balloonContentHeader: 'Точка разрыва',
      balloonContentBody:
        `Высота: <b>${Math.round(burstPt.alt)} м</b><br>` +
        balloonCoordinates(burstPt.lat, burstPt.lon) +
        balloonMotion(points, burstIdx) +
        `Время: <b>${(burstPt.time || '').replace('T', ' ').replace('Z', '')} UTC</b>`,
    }, dotIcon('#ffffff', '#111111'));
    map.geoObjects.add(burstMarker);
  }

  // ── Маркер финиша ──
  const last = points[points.length - 1];
  if (landMarker) map.geoObjects.remove(landMarker);
  landMarker = new ymaps.Placemark([last.lat, last.lon], {
    balloonContentHeader: 'Точка финиша',
    balloonContentBody:
      balloonCoordinates(last.lat, last.lon) +
      balloonMotion(points, points.length - 1) +
      `<br>Время: <b>${(last.time || '').replace('T', ' ').replace('Z', '')} UTC</b>`,
  }, dotIcon('#df715f', '#ffffff'));
  map.geoObjects.add(landMarker);

  // ── Координаты финиша в меню ──
  document.getElementById('res-lat').textContent = last.lat.toFixed(4);
  document.getElementById('res-lon').textContent = last.lon.toFixed(4);
  document.getElementById('result-section').style.display = 'block';

  // ── Подгоняем границы карты под весь трек ──
  const lats = points.map(p => p.lat);
  const lons = points.map(p => p.lon);
  map.setBounds(
    [[Math.min(...lats), Math.min(...lons)], [Math.max(...lats), Math.max(...lons)]],
    { checkZoomRange: true, zoomMargin: 40, duration: 600 },
  );

  document.getElementById('legend').classList.add('show');
}

// ─────────────── Очистка ─────────────────────────
function clearTrajectory(resetResult = true) {
  if (mapReady) {
    trajCollection.removeAll();
    if (landMarker)  { map.geoObjects.remove(landMarker);  }
    if (burstMarker) { map.geoObjects.remove(burstMarker); }
  }
  landMarker  = null;
  burstMarker = null;
  lastTrajectory = [];
  document.getElementById('btn-export').style.display = 'none';
  document.getElementById('btn-export-kml').style.display = 'none';
  if (resetResult) {
    document.getElementById('res-lat').textContent = '—';
    document.getElementById('res-lon').textContent = '—';
    document.getElementById('result-section').style.display = 'none';
  }
  document.getElementById('legend').classList.remove('show');
}

// ─────────────── Уведомление о состоянии ─────────
let _st;
function showStatus(msg, isError = false) {
  const bar = document.getElementById('status-bar');
  bar.textContent = msg;
  bar.className = 'show' + (isError ? ' error' : '');
  clearTimeout(_st);
  _st = setTimeout(() => bar.classList.remove('show'), 6000);
}

// ─────────────── CSRF ────────────────────────────
function getCsrfToken() {
  return document.querySelector(
    '#csrf-form input[name="csrfmiddlewaretoken"]'
  )?.value || '';
}

const hasPredictParams = applyPredictQueryParams();
document.getElementById('inp-float-dur')?.addEventListener('input', syncFloatDurationConversion);
document.getElementById('inp-float-dur-unit')?.addEventListener('change', syncFloatDurationConversion);
toggleFloatDuration();
initResponsiveMenu();
